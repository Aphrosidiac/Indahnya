# nginx for indahnya.my — copy to /etc/nginx/sites-available/indahnya, adjust
# the certificate paths, symlink into sites-enabled, `nginx -t && systemctl reload nginx`.
#
# The app trusts ONE header for the client's address: X-Real-IP, and only when
# the request comes from 127.0.0.1 (server/utils/rate.ts). So nginx must SET
# it (never pass a client's own), and behind Cloudflare first replace
# $remote_addr with CF-Connecting-IP — from Cloudflare's addresses only.

# Behind Cloudflare (proxied DNS): keep this list current from
# https://www.cloudflare.com/ips/ (a cron can refresh it).
# include /etc/nginx/cloudflare-ips.conf;   # lines of: set_real_ip_from <cidr>;
# real_ip_header CF-Connecting-IP;

# access logs without query strings: sign-in links (?t=) and TV links (?token=) are bearer secrets
log_format indahnya '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time "$http_user_agent"';

upstream indahnya_web { server 127.0.0.1:3000; keepalive 32; }

server {
  listen 80;
  listen [::]:80;
  server_name indahnya.my www.indahnya.my indahnya.ffdev.studio;
  return 301 https://indahnya.my$request_uri;
}

server {
  # `listen … http2` works on Ubuntu 24.04's nginx 1.24 (the `http2 on;` directive needs 1.25.1+)
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.indahnya.my indahnya.ffdev.studio;
  ssl_certificate     /etc/letsencrypt/live/indahnya.my/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/indahnya.my/privkey.pem;
  return 301 https://indahnya.my$request_uri;
}

server {
  # `listen … http2` works on Ubuntu 24.04's nginx 1.24 (the `http2 on;` directive needs 1.25.1+)
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name indahnya.my;
  ssl_certificate     /etc/letsencrypt/live/indahnya.my/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/indahnya.my/privkey.pem;

  access_log /var/log/nginx/indahnya.access.log indahnya;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # uploads go straight from the phone to R2; nothing big ever comes through here
  client_max_body_size 1m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml application/xml;
  gzip_min_length 1024;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_read_timeout 120s;

  # the build's hashed assets: straight from disk, cached for good
  location /_nuxt/ {
    alias /srv/indahnya/.output/public/_nuxt/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # the zips stream for as long as they take; never spool them to disk
  location ~ ^/api/events/[^/]+/(download|ucapan\.zip) {
    proxy_pass http://indahnya_web;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    gzip off;
  }

  # Stripe signs the raw body: pass it untouched
  location = /api/stripe/webhook {
    proxy_pass http://indahnya_web;
    proxy_request_buffering on;
  }

  location / {
    proxy_pass http://indahnya_web;
  }
}
