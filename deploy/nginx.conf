# nginx for indahnya.my. deploy/deploy.sh installs it from each release as
# /etc/nginx/sites-available/indahnya (and keeps the previous one if `nginx -t`
# rejects it). TLS: Cloudflare proxies every hostname (SSL Full strict) and this
# box presents a Cloudflare origin certificate (deploy/cloudflare.mjs).
#
# The app trusts ONE header for the client's address: X-Real-IP, and only when
# the request comes from 127.0.0.1 (server/utils/rate.ts). So nginx must SET
# it (never pass a client's own), and behind Cloudflare first replace
# $remote_addr with CF-Connecting-IP — from Cloudflare's addresses only.

# Behind Cloudflare: take the client's address from CF-Connecting-IP, from
# Cloudflare's addresses only. The list (and real_ip_header) is written and
# refreshed weekly by /usr/local/sbin/indahnya-cf-ips (deploy/setup-server.sh).
# It is included in each server block, never here at http level, so on a box
# shared with other sites it changes nothing for them.
# access logs without query strings: sign-in links (?t=) and TV links (?token=) are bearer secrets
log_format indahnya '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time "$http_user_agent"';

# Analytics log (docs/ANALYTICS.md): one JSON line per request, read every 10 minutes by the worker's traffic job.
# - Always $uri, never the query: sign-in links (?t=) and TV links (?token=) are bearer secrets. The one exception
#   is the beacon (/_e), whose query holds the page path, the referrer host and the utm source.
# - The referrer is logged as its host only (a full referrer can carry a token too).
# - /var/log/indahnya is the app user's to read (root:indahnya 0750); nginx's own logrotate rule would make files
#   0640 www-data:adm. Rotation: /etc/logrotate.d/indahnya-traffic (deploy/setup-server.sh and remote.sh install it).
# Names are prefixed: this file shares nginx's http{} with other apps' vhosts.
map $http_referer $indahnya_ref_host { "~^https?://([^/:?#]+)" $1; default ""; }
map $uri $indahnya_beacon { /_e $args; default ""; }
log_format indahnya_json escape=json '{"t":"$time_iso8601","h":"$host","ip":"$remote_addr","m":"$request_method","u":"$uri","s":$status,"b":$body_bytes_sent,"rt":$request_time,"ua":"$http_user_agent","r":"$indahnya_ref_host","c":"$http_cf_ipcountry","q":"$indahnya_beacon"}';

upstream indahnya_web { server 127.0.0.1:3250; keepalive 32; }

server {
  listen 80;
  listen [::]:80;
  server_name indahnya.my www.indahnya.my indahnya.ffdev.studio;
  return 301 https://indahnya.my$request_uri;
}

server {
  # no http2: Cloudflare reaches the origin over HTTP/1.1 anyway, and on nginx
  # 1.24 `listen … http2` would switch it on for every site sharing :443
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name www.indahnya.my indahnya.ffdev.studio;
  ssl_certificate     /etc/ssl/cloudflare/indahnya.my.pem;
  ssl_certificate_key /etc/ssl/cloudflare/indahnya.my.key;
  include /etc/nginx/indahnya-cloudflare-ips.conf;
  return 301 https://indahnya.my$request_uri;
}

server {
  # no http2: Cloudflare reaches the origin over HTTP/1.1 anyway, and on nginx
  # 1.24 `listen … http2` would switch it on for every site sharing :443
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name indahnya.my;
  ssl_certificate     /etc/ssl/cloudflare/indahnya.my.pem;
  ssl_certificate_key /etc/ssl/cloudflare/indahnya.my.key;
  include /etc/nginx/indahnya-cloudflare-ips.conf;

  access_log /var/log/nginx/indahnya.access.log indahnya;
  access_log /var/log/indahnya/traffic.log indahnya_json;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # uploads go straight from the phone to R2; nothing big ever comes through here
  client_max_body_size 1m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml application/xml;
  gzip_min_length 1024;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_read_timeout 120s;

  # the build's hashed assets: straight from disk, cached for good. shared/ holds
  # every recent release's chunks, so a tab opened before a deploy keeps working
  location /_nuxt/ {
    alias /srv/indahnya/shared/_nuxt/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # the zips stream for as long as they take; never spool them to disk
  location ~ ^/api/events/[^/]+/(download|ucapan\.zip) {
    proxy_pass http://indahnya_web;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    gzip off;
  }

  # the analytics beacon (app/plugins/traffic-beacon.client.ts): logged above (query included), answered here, never cached
  location = /_e {
    add_header Cache-Control "no-store" always;
    return 204;
  }

  # CHIP signs the raw body: pass it untouched
  location = /api/chip/webhook {
    proxy_pass http://indahnya_web;
    proxy_request_buffering on;
  }

  location / {
    proxy_pass http://indahnya_web;
  }
}
